<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12161c"/><stop offset="1" stop-color="#0e1116"/></linearGradient>
    <clipPath id="frame"><rect width="720" height="240" rx="18"/></clipPath>
    <clipPath id="screen"><rect x="501" y="25" width="106" height="248" rx="8"/></clipPath>
    <linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c0703a"/><stop offset="1" stop-color="#3a2a4a"/></linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f5d7a"/><stop offset="1" stop-color="#13202c"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a3f63"/><stop offset="1" stop-color="#1d1426"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d6b3a"/><stop offset="1" stop-color="#16200f"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5a2b"/><stop offset="1" stop-color="#241a10"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4f8a"/><stop offset="1" stop-color="#141a2e"/></linearGradient>
    <linearGradient id="pk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d232c"/><stop offset="1" stop-color="#171c23"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>
    <style>
  text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  .mono{font-family:'JetBrains Mono','Cascadia Mono',ui-monospace,Menlo,monospace}
  .ttl{font-size:50px;font-weight:800;letter-spacing:-.5px}
  .tag{font-size:13px;fill:#8e97a4}
  .chipt{font-size:11.5px;font-weight:600;fill:#e8e2d4}

  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
  @keyframes chip{from{opacity:0;transform:translateY(8px) scale(.7)}to{opacity:1;transform:none}}

  /* name: "Pocket" rises, "Stash" drops in with a bounce, tagline follows */
  .tp{animation:rise .6s cubic-bezier(.22,1.2,.36,1) .1s both}
  .ts{animation:drop .75s cubic-bezier(.3,1.6,.5,1) .35s both}
  .tg{animation:fade .6s ease .8s both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes drop{from{opacity:0;transform:translateY(-34px)}to{opacity:1;transform:none}}

  /* the pocket slides up, then the phone rises out of it */
  .pocket{animation:rise .55s ease-out .35s both}
  .phone{animation:out 1s cubic-bezier(.25,1.25,.4,1) .75s both}
  @keyframes out{from{transform:translateY(150px)}to{transform:none}}

  /* scene grid */
  .bar{animation:fade .3s ease 1.45s both}
  .c0{animation:pop .42s cubic-bezier(.34,1.6,.64,1) 1.55s both;transform-origin:528.5px 55.8px}.c1{animation:pop .42s cubic-bezier(.34,1.6,.64,1) 1.64s both;transform-origin:581.5px 55.8px}.c2{animation:pop .42s cubic-bezier(.34,1.6,.64,1) 1.73s both;transform-origin:528.5px 96.2px}.c3{animation:pop .42s cubic-bezier(.34,1.6,.64,1) 1.82s both;transform-origin:581.5px 96.2px}.c4{animation:pop .42s cubic-bezier(.34,1.6,.64,1) 1.91s both;transform-origin:528.5px 136.8px}.c5{animation:pop .42s cubic-bezier(.34,1.6,.64,1) 2.00s both;transform-origin:581.5px 136.8px}

  /* tap ripple, then the scene opens from the tapped card */
  .rip{opacity:0;animation:rip .5s ease-out 2.5s both;transform-origin:528.5px 55.8px}
  @keyframes rip{0%{opacity:.85;transform:scale(.2)}100%{opacity:0;transform:scale(1.6)}}
  .open{animation:open .5s cubic-bezier(.3,1.1,.4,1) 2.78s both}
  @keyframes open{from{opacity:.2;transform:translate(272.41px,37.29px) scale(0.4623,0.1884)}to{opacity:1;transform:none}}

  /* play button pops then gets out of the way once playback starts */
  .play{animation:play 1s ease 3.15s both;transform-origin:554.0px 55.0px}
  @keyframes play{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.1)}45%{transform:none;opacity:1}100%{opacity:0;transform:scale(.9)}}

  /* progress: plays, jumps +15s on the double-tap, keeps playing */
  .prog{transform-origin:505.0px 0;animation:prog 2.6s linear 3.3s both}
  @keyframes prog{0%{transform:scaleX(.04)}22%{transform:scaleX(.26)}26%{transform:scaleX(.56)}100%{transform:scaleX(.66)}}
  .t0{animation:pop .3s cubic-bezier(.34,1.8,.64,1) 3.45s both;transform-origin:522.6px 81.0px}.t1{animation:pop .3s cubic-bezier(.34,1.8,.64,1) 3.57s both;transform-origin:545.2px 81.0px}.t2{animation:pop .3s cubic-bezier(.34,1.8,.64,1) 3.69s both;transform-origin:566.7px 81.0px}.t3{animation:pop .3s cubic-bezier(.34,1.8,.64,1) 3.81s both;transform-origin:587.3px 81.0px}

  /* double-tap on the right of the video: two ripples and a "+15s" bubble */
  .d1{opacity:0;animation:rip2 .45s ease-out 3.82s both} .d2{opacity:0;animation:rip2 .45s ease-out 4.02s both}
  .d1,.d2{transform-origin:585.0px 55.0px}
  @keyframes rip2{0%{opacity:.7;transform:scale(.3)}100%{opacity:0;transform:scale(1.5)}}
  .skip{opacity:0;animation:skip 1.1s ease 3.85s both}
  @keyframes skip{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}

  /* swipe up on the right: the volume slider fills, then fades */
  .vol{opacity:0;animation:skip 1.25s ease 4.45s both}
  .volf{transform-origin:0 76.0px;animation:volf .7s ease-out 4.55s both}
  @keyframes volf{from{transform:scaleY(.25)}to{transform:scaleY(.9)}}
  .finger{opacity:0;animation:finger .8s ease-in-out 4.45s both}
  @keyframes finger{0%{opacity:0;transform:translateY(14px)}20%{opacity:.9}80%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}

  /* details under the video, then the rating fills star by star */
  .meta{animation:fade .4s ease 3.25s both}
  .s0{animation:fade .18s ease 4.95s both}.s1{animation:fade .18s ease 5.07s both}.s2{animation:fade .18s ease 5.19s both}.s3{animation:fade .18s ease 5.31s both}.s4{animation:fade .18s ease 5.43s both}

  /* feature chips on the left, in step with the phone */
  .k0{animation:chip .5s cubic-bezier(.34,1.6,.64,1) 1.85s both;transform-origin:107px 158px}.k1{animation:chip .5s cubic-bezier(.34,1.6,.64,1) 3.4s both;transform-origin:279px 158px}.k2{animation:chip .5s cubic-bezier(.34,1.6,.64,1) 3.95s both;transform-origin:139px 192px}.k3{animation:chip .5s cubic-bezier(.34,1.6,.64,1) 5.05s both;transform-origin:316px 192px}
    </style>
  </defs>
  <rect width="720" height="240" rx="18" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
  <text class="ttl tp" x="214" y="86" text-anchor="end" fill="#e8e2d4">Pocket</text>
  <text class="ttl ts" x="215" y="86" text-anchor="start" fill="#f0a640">Stash</text>
  <text class="tag tg" x="48" y="114">Your whole Stash library, in your pocket.</text>
  <g class="k0"><rect x="48" y="146" width="118" height="24" rx="12" fill="#171c23" stroke="#2a313c" stroke-width="1.2"/><text x="61" y="162.3" class="chipt" fill="#f0a640" style="fill:#f0a640">▦</text><text x="75" y="162.3" class="chipt">8 libraries</text></g>
  <g class="k1"><rect x="176" y="146" width="206" height="24" rx="12" fill="#171c23" stroke="#2a313c" stroke-width="1.2"/><text x="189" y="162.3" class="chipt" fill="#f0a640" style="fill:#f0a640">▶</text><text x="203" y="162.3" class="chipt">resume where you left off</text></g>
  <g class="k2"><rect x="48" y="180" width="182" height="24" rx="12" fill="#171c23" stroke="#2a313c" stroke-width="1.2"/><text x="61" y="196.3" class="chipt" fill="#f0a640" style="fill:#f0a640">»</text><text x="75" y="196.3" class="chipt">double-tap −5s / +15s</text></g>
  <g class="k3"><rect x="240" y="180" width="152" height="24" rx="12" fill="#171c23" stroke="#2a313c" stroke-width="1.2"/><text x="253" y="196.3" class="chipt" fill="#f0a640" style="fill:#f0a640">★</text><text x="267" y="196.3" class="chipt">rate · edit · mark</text></g>
  <g class="phone">
    <rect x="494" y="16" width="120" height="248" rx="17" fill="#0a0c10" stroke="#39414d" stroke-width="2"/>
    <rect x="540.0" y="19.5" width="28" height="3.5" rx="1.75" fill="#20262f"/>
    <g clip-path="url(#screen)">
      <rect x="501" y="25" width="106" height="248" fill="#0e1116"/>
      <g class="bar"><text x="505" y="35" style="font-size:7.5px;font-weight:800" fill="#e8e2d4">Pocket<tspan fill="#f0a640">Stash</tspan></text><circle cx="598" cy="32.5" r="3" fill="none" stroke="#8e97a4" stroke-width="1"/></g>
      <g class="c0"><rect x="504" y="42.0" width="49" height="27.5" rx="3" fill="url(#g0)"/><rect x="539" y="62.5" width="12" height="5" rx="1.5" fill="#000" fill-opacity=".7"/><rect x="504" y="67.9" width="29.4" height="1.6" fill="#f0a640"/><rect x="504" y="72.5" width="42.1" height="3" rx="1.5" fill="#3a4250"/><rect x="504" y="77.5" width="27.0" height="2.4" rx="1.2" fill="#252c36"/></g>
      <g class="c1"><rect x="557" y="42.0" width="49" height="27.5" rx="3" fill="#050506"/><rect x="573.77" y="42.0" width="15.47" height="27.5" fill="url(#g1)"/><rect x="592" y="62.5" width="12" height="5" rx="1.5" fill="#000" fill-opacity=".7"/><rect x="557" y="72.5" width="42.1" height="3" rx="1.5" fill="#3a4250"/><rect x="557" y="77.5" width="27.0" height="2.4" rx="1.2" fill="#252c36"/></g>
      <g class="c2"><rect x="504" y="82.5" width="49" height="27.5" rx="3" fill="url(#g2)"/><rect x="539" y="103.0" width="12" height="5" rx="1.5" fill="#000" fill-opacity=".7"/><rect x="504" y="113.0" width="42.1" height="3" rx="1.5" fill="#3a4250"/><rect x="504" y="118.0" width="27.0" height="2.4" rx="1.2" fill="#252c36"/></g>
      <g class="c3"><rect x="557" y="82.5" width="49" height="27.5" rx="3" fill="url(#g3)"/><rect x="592" y="103.0" width="12" height="5" rx="1.5" fill="#000" fill-opacity=".7"/><rect x="557" y="108.4" width="14.7" height="1.6" fill="#f0a640"/><rect x="557" y="113.0" width="42.1" height="3" rx="1.5" fill="#3a4250"/><rect x="557" y="118.0" width="27.0" height="2.4" rx="1.2" fill="#252c36"/></g>
      <g class="c4"><rect x="504" y="123.0" width="49" height="27.5" rx="3" fill="#050506"/><rect x="510.17" y="123.0" width="36.67" height="27.5" fill="url(#g4)"/><rect x="539" y="143.5" width="12" height="5" rx="1.5" fill="#000" fill-opacity=".7"/><rect x="504" y="153.5" width="42.1" height="3" rx="1.5" fill="#3a4250"/><rect x="504" y="158.5" width="27.0" height="2.4" rx="1.2" fill="#252c36"/></g>
      <g class="c5"><rect x="557" y="123.0" width="49" height="27.5" rx="3" fill="url(#g5)"/><rect x="592" y="143.5" width="12" height="5" rx="1.5" fill="#000" fill-opacity=".7"/><rect x="557" y="153.5" width="42.1" height="3" rx="1.5" fill="#3a4250"/><rect x="557" y="158.5" width="27.0" height="2.4" rx="1.2" fill="#252c36"/></g>
      <circle class="rip" cx="528.5" cy="55.75" r="14" fill="#fff" fill-opacity=".6"/>
      <g class="open">
        <rect x="501" y="25" width="106" height="248" fill="#0e1116"/>
        <rect x="501" y="25" width="106" height="60" fill="url(#g0)"/>
        <rect x="501" y="67" width="106" height="18" fill="url(#shade)"/>
        <rect x="505" y="79" width="98" height="2" rx="1" fill="#fff" fill-opacity=".28"/>
        <rect class="prog" x="505" y="79" width="98" height="2" rx="1" fill="#f0a640"/>
        <rect class="t0" x="521.8" y="76.8" width="1.6" height="6.4" rx=".8" fill="#fff"/>
        <rect class="t1" x="544.4" y="76.8" width="1.6" height="6.4" rx=".8" fill="#fff"/>
        <rect class="t2" x="565.9" y="76.8" width="1.6" height="6.4" rx=".8" fill="#fff"/>
        <rect class="t3" x="586.5" y="76.8" width="1.6" height="6.4" rx=".8" fill="#fff"/>
        <g class="play"><circle cx="554.0" cy="55.0" r="11" fill="#f0a640"/><path d="M550.5,49.5 L559.5,55.0 L550.5,60.5 Z" fill="#15110c"/></g>
        <circle class="d1" cx="585" cy="55.0" r="12" fill="#fff" fill-opacity=".5"/>
        <circle class="d2" cx="585" cy="55.0" r="12" fill="#fff" fill-opacity=".5"/>
        <g class="skip"><path d="M607,31 h-30 a24,24 0 0 0 0,44 h30 z" fill="#fff" fill-opacity=".16"/><text x="592" y="58.0" text-anchor="middle" style="font-size:8.5px;font-weight:800" fill="#fff">+15s</text></g>
        <g class="vol"><rect x="596.5" y="34" width="7" height="38" rx="3.5" fill="#000" fill-opacity=".55"/><rect x="598.8" y="37" width="2.4" height="32" rx="1.2" fill="#fff" fill-opacity=".25"/><rect class="volf" x="598.8" y="37" width="2.4" height="32" rx="1.2" fill="#f0a640"/></g>
        <circle class="finger" cx="586" cy="65" r="5" fill="#fff" fill-opacity=".55"/>
        <g class="meta"><rect x="505" y="93" width="82.7" height="4.5" rx="2.2" fill="#e8e2d4" fill-opacity=".85"/><rect x="505" y="101" width="47.7" height="3" rx="1.5" fill="#8e97a4"/><circle cx="511" cy="128" r="5.5" fill="url(#g2)" stroke="#2a313c"/><circle cx="526" cy="128" r="5.5" fill="url(#g3)" stroke="#2a313c"/><circle cx="541" cy="128" r="5.5" fill="url(#g4)" stroke="#2a313c"/><circle cx="556" cy="128" r="5.5" fill="url(#g5)" stroke="#2a313c"/><rect x="505" y="139" width="22" height="7" rx="3.5" fill="#252c36"/><rect x="531" y="139" width="22" height="7" rx="3.5" fill="#252c36"/><rect x="557" y="139" width="22" height="7" rx="3.5" fill="#252c36"/><rect x="583" y="139" width="22" height="7" rx="3.5" fill="#252c36"/><rect x="505" y="151" width="98" height="2.5" rx="1.2" fill="#252c36"/></g>
        <polygon points="509.00,108.60 510.16,111.40 513.18,111.64 510.88,113.61 511.59,116.56 509.00,114.98 506.41,116.56 507.12,113.61 504.82,111.64 507.84,111.40" fill="#252c36"/>
        <polygon class="s0" points="509.00,108.60 510.16,111.40 513.18,111.64 510.88,113.61 511.59,116.56 509.00,114.98 506.41,116.56 507.12,113.61 504.82,111.64 507.84,111.40" fill="#f0a640"/>
        <polygon points="520.00,108.60 521.16,111.40 524.18,111.64 521.88,113.61 522.59,116.56 520.00,114.98 517.41,116.56 518.12,113.61 515.82,111.64 518.84,111.40" fill="#252c36"/>
        <polygon class="s1" points="520.00,108.60 521.16,111.40 524.18,111.64 521.88,113.61 522.59,116.56 520.00,114.98 517.41,116.56 518.12,113.61 515.82,111.64 518.84,111.40" fill="#f0a640"/>
        <polygon points="531.00,108.60 532.16,111.40 535.18,111.64 532.88,113.61 533.59,116.56 531.00,114.98 528.41,116.56 529.12,113.61 526.82,111.64 529.84,111.40" fill="#252c36"/>
        <polygon class="s2" points="531.00,108.60 532.16,111.40 535.18,111.64 532.88,113.61 533.59,116.56 531.00,114.98 528.41,116.56 529.12,113.61 526.82,111.64 529.84,111.40" fill="#f0a640"/>
        <polygon points="542.00,108.60 543.16,111.40 546.18,111.64 543.88,113.61 544.59,116.56 542.00,114.98 539.41,116.56 540.12,113.61 537.82,111.64 540.84,111.40" fill="#252c36"/>
        <polygon class="s3" points="542.00,108.60 543.16,111.40 546.18,111.64 543.88,113.61 544.59,116.56 542.00,114.98 539.41,116.56 540.12,113.61 537.82,111.64 540.84,111.40" fill="#f0a640"/>
        <polygon points="553.00,108.60 554.16,111.40 557.18,111.64 554.88,113.61 555.59,116.56 553.00,114.98 550.41,116.56 551.12,113.61 548.82,111.64 551.84,111.40" fill="#252c36"/>
        <polygon class="s4" points="553.00,108.60 554.16,111.40 557.18,111.64 554.88,113.61 555.59,116.56 553.00,114.98 550.41,116.56 551.12,113.61 548.82,111.64 551.84,111.40" fill="#f0a640"/>
      </g>
    </g>
  </g>
  <g class="pocket">
    <path d="M450,176 Q554,190 658,176 L658,252 L450,252 Z" fill="url(#pk)" stroke="#2a313c" stroke-width="1.5"/>
    <path d="M460,186 Q554,199 648,186" fill="none" stroke="#f0a640" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round" opacity=".75"/>
    <path d="M462,192 L462,250 M646,192 L646,250" fill="none" stroke="#f0a640" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round" opacity=".5"/>
    <circle cx="458" cy="181" r="2.6" fill="#f0a640"/><circle cx="650" cy="181" r="2.6" fill="#f0a640"/>
  </g>
  </g>
</svg>
